[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "astrbot-plugin-yebot"
version = "0.1.0"
description = "YeBot plugin for staged QQ message observation and agent orchestration."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["yebot*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["yebot"]
